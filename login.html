<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | NextCI</title>
    <meta name="description" content="Sign in to your NextCI account to access your career intelligence dashboard.">
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="./src/auth.css">
</head>

<body class="auth-page">

    <!-- Background Effects -->
    <div class="auth-bg">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <main class="auth-container">
        <!-- Left: Branding Panel -->
        <div class="auth-branding">
            <a href="/" class="logo display-font">Next<span>CI</span></a>

            <div class="branding-content">
                <h1>Welcome Back</h1>
                <p>Continue building your AI-proof career with the intelligence you need.</p>

                <div class="stats-mini">
                    <div class="stat-mini">
                        <span class="stat-value">2.4M</span>
                        <span class="stat-label">Analyses Run</span>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-value">97%</span>
                        <span class="stat-label">Accuracy Rate</span>
                    </div>
                </div>
            </div>

            <div class="branding-footer">
                <p>&copy; 2026 NextCI. All rights reserved.</p>
            </div>
        </div>

        <!-- Right: Login Form -->
        <div class="auth-form-panel">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Sign In</h2>
                    <p>Access your career intelligence dashboard</p>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button class="btn btn-social" type="button">
                        <svg viewBox="0 0 24 24" class="google-icon">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Continue with Google
                    </button>

                    <button class="btn btn-social" type="button">
                        <svg viewBox="0 0 24 24" fill="currentColor" class="linkedin-icon">
                            <path
                                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                        </svg>
                        Continue with LinkedIn
                    </button>
                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Email Form -->
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@company.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            Password
                            <a href="/forgot-password.html" class="forgot-link">Forgot?</a>
                        </label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                required>
                            <button type="button" class="toggle-password" aria-label="Show password">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        Sign In
                    </button>
                </form>

                <p class="switch-auth">
                    Don't have an account? <a href="/signup.html">Create one free</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Password visibility toggle
        document.querySelector('.toggle-password')?.addEventListener('click', function () {
            const input = document.getElementById('password');
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            this.classList.toggle('visible');
        });

        // Form submission
        document.getElementById('loginForm')?.addEventListener('submit', function (e) {
            e.preventDefault();

            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = 'Signing in...';
            btn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);
        });
    </script>
</body>

</html>
