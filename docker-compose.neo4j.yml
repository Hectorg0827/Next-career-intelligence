# ========================================
# Neo4j Talent Graph - Docker Compose
# ========================================
# Start Neo4j: docker-compose -f docker-compose.neo4j.yml up -d
# Stop Neo4j: docker-compose -f docker-compose.neo4j.yml down
# View logs: docker-compose -f docker-compose.neo4j.yml logs -f

version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0-enterprise
    container_name: next-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"  # HTTP (Neo4j Browser)
      - "7687:7687"  # Bolt protocol (Python driver)

    environment:
      # Authentication
      NEO4J_AUTH: neo4j/next-career-password-2024

      # Accept Enterprise license (for GDS)
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"

      # Plugins
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'

      # Memory settings (adjust based on your machine)
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G

      # Performance tuning
      NEO4J_dbms_default__listen__address: 0.0.0.0
      NEO4J_dbms_connector_bolt_advertised__address: localhost:7687
      NEO4J_dbms_connector_http_advertised__address: localhost:7474

      # Enable APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*

      # Query timeout (30 seconds)
      NEO4J_dbms_transaction_timeout: 30s

    volumes:
      # Persistent data storage
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

      # Initial schema (mount for easy loading)
      - ./backend/neo4j:/schema

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional: Redis for caching Neo4j query results
  redis:
    image: redis:7-alpine
    container_name: next-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: next-network
