[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# as well as the filename.
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field of the filename, or -1 to skip this.
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be present in each
# directory.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version path separator; As mentioned in the config init docs
# this is the character used to split version_locations
# version_path_separator = :

# the output encoding used when revision files
# are written from script.mako
# output_encoding = utf-8

sqlalchemy.url = driver://user:password@localhost/dbname


# This is the logging configuration for Alembic. Remove this section
# after you have adjusted alembic manually to define your templating
# options, define the value of sqlalchemy.url, etc.
[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
drawing_leading_space = false
